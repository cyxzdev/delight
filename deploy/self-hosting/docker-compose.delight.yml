# Delight: serve our own build of fluxer_app (../../fluxer_app/dist) instead of the one baked into the image.
services:
  app-proxy:
    volumes:
      - ../../fluxer_app/dist:/srv/app/static:ro
  static-proxy:
    volumes:
      - ../../delight/avatars/0.png:/srv/fluxer-static/avatars/0.png:ro
      - ../../delight/avatars/1.png:/srv/fluxer-static/avatars/1.png:ro
      - ../../delight/avatars/2.png:/srv/fluxer-static/avatars/2.png:ro
      - ../../delight/avatars/3.png:/srv/fluxer-static/avatars/3.png:ro
      - ../../delight/avatars/4.png:/srv/fluxer-static/avatars/4.png:ro
      - ../../delight/avatars/5.png:/srv/fluxer-static/avatars/5.png:ro
      - ../../delight/web/favicon-16x16.png:/srv/fluxer-static/web/favicon-16x16.png:ro
      - ../../delight/web/favicon-32x32.png:/srv/fluxer-static/web/favicon-32x32.png:ro
      - ../../delight/web/apple-touch-icon.png:/srv/fluxer-static/web/apple-touch-icon.png:ro
      - ../../delight/web/android-chrome-192x192.png:/srv/fluxer-static/web/android-chrome-192x192.png:ro
      - ../../delight/web/android-chrome-512x512.png:/srv/fluxer-static/web/android-chrome-512x512.png:ro
      - ../../delight/web/mstile-150x150.png:/srv/fluxer-static/web/mstile-150x150.png:ro
      - ../../delight/web/favicon.ico:/srv/fluxer-static/web/favicon.ico:ro
  api:
    environment:
      # New accounts join the Delight community automatically.
      FLUXER_AUTO_JOIN_INVITE_CODE: delight
  worker:
    environment:
      FLUXER_AUTO_JOIN_INVITE_CODE: delight
  # Delight sidecar (delight/service/server.ts): per-user state Fluxer's API has no field for, e.g. profile effects.
  # The edge serves it at /delight/*.
  delight-svc:
    image: oven/bun:1-alpine
    restart: ${FLUXER_RESTART_POLICY:-unless-stopped}
    networks: [fluxer]
    working_dir: /app
    command: ["bun", "run", "/app/server.ts"]
    environment:
      PORT: "3000"
      DATA_DIR: /data
      FLUXER_API_URL: http://api:8080
      # Fluxer's API checks Origin on browser-style requests; send the public origin.
      FLUXER_ORIGIN: ${DELIGHT_FLUXER_ORIGIN:-${FLUXER_PUBLIC_ORIGIN:-http://localhost:3131}}
      # Profile badges: artwork served at /delight/badge-assets/; extra badge staff besides instance admins.
      DELIGHT_BADGE_ASSET_DIR: /badges
      DELIGHT_ADMIN_USER_IDS: ${DELIGHT_ADMIN_USER_IDS:-}
      # Profile frames: artwork served at /delight/frame-assets/<frame>/<piece>.webp.
      DELIGHT_FRAME_ASSET_DIR: /frames
      # Video profile effects (the premium Angelic collection): /delight/effect-assets/<effect>/loop.mp4|webm, poster.webp.
      DELIGHT_EFFECT_ASSET_DIR: /effects
    volumes:
      - ../../delight/service:/app:ro
      - ../../delight/badges:/badges:ro
      - ../../delight/frames:/frames:ro
      - ../../delight/effects:/effects:ro
      - delight-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Shows "Delight" instead of the upstream name in the prebuilt admin panel (see delight/service/admin-proxy.ts).
  delight-admin:
    image: oven/bun:1-alpine
    restart: ${FLUXER_RESTART_POLICY:-unless-stopped}
    networks: [fluxer]
    working_dir: /app
    command: ["bun", "run", "/app/admin-proxy.ts"]
    environment:
      PORT: "3001"
      DELIGHT_ADMIN_UPSTREAM: http://admin:8080
    volumes:
      - ../../delight/service:/app:ro
    depends_on:
      admin: {condition: service_started}

volumes:
  delight-data:
